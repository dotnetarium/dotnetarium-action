name: GitHub Action integration

on:
  push:
    branches: [main]
    paths:
      - 'action.yml'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      upload-fixture-sarif:
        description: Upload deliberately vulnerable fixture findings to code scanning.
        type: boolean
        default: false
  pull_request:
    paths:
      - 'action.yml'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  shared-props-package:
    name: Shared props package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Scanner source includes the CLI analysis-profile override. The composite
      # jobs below separately exercise the currently published CLI package.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dotnetarium/dotnetarium
          ref: b2da8d4f6f915b1d81b387c5a2192faa5cdf6e1a # v2.8.1
          path: .scanner-source
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Pack fixed scanner and exercise Action scripts
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'scanner-source'
          Copy-Item .scanner-source $source -Recurse
          $packages = Join-Path $env:RUNNER_TEMP 'scanner-packages'
          dotnet pack "$source/Dotnetarium.Tool/Dotnetarium.Tool.csproj" -c Release -p:RunAnalyzers=false -o $packages
          if ($LASTEXITCODE -ne 0) { throw 'Scanner package build failed.' }
          ./tests/ActionSmoke/Test.ps1 -ToolPackage (Get-ChildItem "$packages/dotnetarium.*.nupkg" | Select-Object -First 1).FullName

  composite:
    name: Composite (${{ matrix.os }}, ${{ matrix.framework }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        framework: [net8.0, net10.0]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Default no-build, SDK setup and restore
        id: direct
        uses: ./
        with:
          target: tests/ActionSmoke/Fixture/ActionFixture.csproj
          framework: ${{ matrix.framework }}
          configuration: Release
          sarif-file: action-default.sarif
          upload-sarif: 'false'
          upload-artifact: 'true'
          artifact-name: direct-${{ matrix.os }}-${{ matrix.framework }}
          artifact-retention-days: '0'
      - name: Project loading with prepared SDKs and dependencies
        id: project
        uses: ./
        with:
          target: tests/ActionSmoke/Fixture/ActionFixture.csproj
          framework: ${{ matrix.framework }}
          configuration: Release
          setup-dotnet: 'false'
          restore: 'false'
          project-mode: 'true'
          sarif-file: action-project.sarif
          upload-sarif: 'false'
      - name: Check findings, flows and Action outputs
        shell: pwsh
        env:
          DIRECT_COUNT: ${{ steps.direct.outputs.findings }}
          DIRECT_INPUT: ${{ steps.direct.outputs.input-status }}
          PROJECT_COUNT: ${{ steps.project.outputs.findings }}
        run: |
          if ([int]$env:DIRECT_COUNT -lt 2 -or [int]$env:PROJECT_COUNT -lt 2) {
            throw 'Action output lost expected findings.'
          }
          if ($env:DIRECT_INPUT -ne 'available') { throw 'Unexpected degraded fixture inputs.' }
          foreach ($file in 'action-default.sarif', 'action-project.sarif') {
            $report = Get-Content -LiteralPath $file -Raw | ConvertFrom-Json
            $results = @($report.runs[0].results)
            foreach ($rule in 'DNA0003', 'DNA0014') {
              if ($rule -notin $results.ruleId) { throw "Missing $rule in $file" }
            }
            $xss = $results | Where-Object ruleId -eq 'DNA0003' | Select-Object -First 1
            if (-not $xss.codeFlows) { throw "Missing source-to-sink flow in $file" }
            foreach ($result in $results) {
              foreach ($location in $result.locations) {
                if ([IO.Path]::IsPathRooted($location.physicalLocation.artifactLocation.uri)) {
                  throw 'Finding path is not repository-relative.'
                }
              }
            }
          }
      - name: Prepare unusable project
        shell: pwsh
        run: "'<Project><broken' | Set-Content -LiteralPath broken.csproj"
      - name: Fail after retaining a failure report
        id: broken
        continue-on-error: true
        uses: ./
        with:
          target: broken.csproj
          setup-dotnet: 'false'
          restore: 'false'
          sarif-file: action-failed.sarif
          upload-sarif: 'false'
          upload-artifact: 'true'
          artifact-name: failed-${{ matrix.os }}-${{ matrix.framework }}
          artifact-retention-days: '1'
      - name: Download retained failure report
        if: ${{ !cancelled() && steps.broken.outcome != 'skipped' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: failed-${{ matrix.os }}-${{ matrix.framework }}
          path: retained-failure
      - name: Check execution failure is propagated
        if: ${{ !cancelled() && steps.broken.outcome != 'skipped' }}
        shell: pwsh
        env:
          BROKEN_OUTCOME: ${{ steps.broken.outcome }}
        run: |
          if ($env:BROKEN_OUTCOME -ne 'failure') { throw 'Execution failure did not fail the composite.' }
          $report = Get-Content -LiteralPath action-failed.sarif -Raw | ConvertFrom-Json
          if ($report.runs[0].invocations[0].executionSuccessful) { throw 'Failure report incorrectly claims success.' }
          $retained = Get-Content -LiteralPath retained-failure/action-failed.sarif -Raw | ConvertFrom-Json
          if ($retained.runs[0].invocations[0].executionSuccessful) { throw 'Artifact did not preserve the failed invocation.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: action-${{ matrix.os }}-${{ matrix.framework }}
          path: action-*.sarif
          if-no-files-found: error
          retention-days: 7

  reusable:
    name: Reusable workflow and SARIF upload
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/scan.yml
    with:
      target: tests/ActionSmoke/Fixture/ActionFixture.csproj
      framework: net10.0
      configuration: Release
      category: dotnetarium-action-integration
      timeout-minutes: 12
      artifact-retention-days: 1
      respect-editorconfig: true
      config-include: |
        **/*.json
        **/*.yml
      config-exclude: |
        **/ignored/**
      upload-sarif: ${{ github.event_name == 'workflow_dispatch' && inputs.upload-fixture-sarif }}

  reusable-report:
    name: Reusable report and outputs
    needs: reusable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dotnetarium-sarif
      - name: Compare public outputs with retained report
        shell: pwsh
        env:
          FINDINGS: ${{ needs.reusable.outputs.findings }}
          INPUT_STATUS: ${{ needs.reusable.outputs.input-status }}
          ANALYSIS_STATUS: ${{ needs.reusable.outputs.analysis-status }}
        run: |
          $run = (Get-Content dotnetarium.sarif -Raw | ConvertFrom-Json).runs[0]
          $count = @($run.results | Where-Object ruleId -ne 'DNA9000').Count
          if ($count -lt 2 -or $env:FINDINGS -ne [string]$count) { throw 'Reusable finding output does not match SARIF.' }
          $properties = $run.invocations[0].properties
          if ($env:INPUT_STATUS -ne 'available' -or $env:INPUT_STATUS -ne $properties.'dotnetarium.inputStatus') {
            throw 'Reusable workflow lost input status.'
          }
          if (-not $env:ANALYSIS_STATUS -or $env:ANALYSIS_STATUS -ne $properties.'dotnetarium.analysisStatus') {
            throw 'Reusable workflow lost analysis status.'
          }
