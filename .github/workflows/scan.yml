name: Dotnetarium scan

on:
  workflow_call:
    inputs:
      target:
        description: Repository-relative solution or project path.
        required: true
        type: string
      version:
        description: Exact stable CLI version.
        default: '2.7.1'
        type: string
      config:
        description: Optional repository-relative JSON configuration path.
        default: ''
        type: string
      configuration:
        default: Debug
        type: string
      framework:
        default: ''
        type: string
      project-mode:
        default: false
        type: boolean
      restore:
        description: Run dependency restore before scanning.
        default: true
        type: boolean
      dotnet-version:
        default: |
          8.0.x
          10.0.x
        type: string
      runner:
        default: ubuntu-latest
        type: string
      upload-sarif:
        default: true
        type: boolean
      category:
        default: dotnetarium
        type: string
      artifact-name:
        description: Unique SARIF artifact name when calling this workflow more than once.
        default: dotnetarium-sarif
        type: string
    outputs:
      findings:
        description: Total security findings; this is not a new-alert count.
        value: ${{ jobs.scan.outputs.findings }}
      input-status:
        description: Input status reported by the CLI.
        value: ${{ jobs.scan.outputs.input-status }}
      analysis-status:
        description: Analysis status reported by the CLI.
        value: ${{ jobs.scan.outputs.analysis-status }}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  scan:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    outputs:
      findings: ${{ steps.scan.outputs.findings }}
      input-status: ${{ steps.scan.outputs.input-status }}
      analysis-status: ${{ steps.scan.outputs.analysis-status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan and upload
        id: scan
        uses: dotnetarium/dotnetarium-action@de145b7ae5b4bea1cca0edef7eb184fed486ed56
        with:
          target: ${{ inputs.target }}
          version: ${{ inputs.version }}
          config: ${{ inputs.config }}
          configuration: ${{ inputs.configuration }}
          framework: ${{ inputs.framework }}
          project-mode: ${{ inputs.project-mode }}
          restore: ${{ inputs.restore }}
          dotnet-version: ${{ inputs.dotnet-version }}
          upload-sarif: ${{ inputs.upload-sarif }}
          category: ${{ inputs.category }}
      - name: Retain SARIF report
        if: ${{ !cancelled() && steps.scan.outputs.sarif-file != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ steps.scan.outputs.sarif-file }}
          if-no-files-found: warn
          retention-days: 14
