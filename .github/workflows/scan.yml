name: Dotnetarium scan

on:
  workflow_call:
    inputs:
      target:
        description: Repository-relative solution or project path.
        required: true
        type: string
      version:
        description: Exact stable CLI version.
        default: '2.7.1'
        type: string
      config:
        description: Optional repository-relative JSON configuration path.
        default: ''
        type: string
      analysis-profile:
        description: Optional fast, full or max override; requires a compatible CLI release.
        default: ''
        type: string
      respect-editorconfig:
        default: false
        type: boolean
      config-include:
        description: Newline-separated credential/config-file include globs.
        default: ''
        type: string
      config-exclude:
        description: Newline-separated credential/config-file exclude globs.
        default: ''
        type: string
      configuration:
        default: Debug
        type: string
      framework:
        default: ''
        type: string
      project-mode:
        default: false
        type: boolean
      restore:
        description: Run dependency restore before scanning.
        default: true
        type: boolean
      dotnet-version:
        default: |
          8.0.x
          10.0.x
        type: string
      runner:
        default: ubuntu-latest
        type: string
      timeout-minutes:
        description: Maximum job duration; must fit the runner's supported timeout.
        default: 20
        type: number
      upload-sarif:
        default: true
        type: boolean
      upload-artifact:
        default: true
        type: boolean
      artifact-retention-days:
        description: SARIF retention in days; 0 inherits repository policy.
        default: 14
        type: number
      category:
        default: dotnetarium
        type: string
      artifact-name:
        description: Unique SARIF artifact name when calling this workflow more than once.
        default: dotnetarium-sarif
        type: string
    outputs:
      findings:
        description: Total security findings; this is not a new-alert count.
        value: ${{ jobs.scan.outputs.findings }}
      input-status:
        description: Input status reported by the CLI.
        value: ${{ jobs.scan.outputs.input-status }}
      analysis-status:
        description: Analysis status reported by the CLI.
        value: ${{ jobs.scan.outputs.analysis-status }}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  scan:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      findings: ${{ steps.scan.outputs.findings }}
      input-status: ${{ steps.scan.outputs.input-status }}
      analysis-status: ${{ steps.scan.outputs.analysis-status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan and upload
        id: scan
        uses: dotnetarium/dotnetarium-action@8ba207d9ffe9077e88f57414d92cb50ba779cbd6
        with:
          target: ${{ inputs.target }}
          version: ${{ inputs.version }}
          config: ${{ inputs.config }}
          analysis-profile: ${{ inputs.analysis-profile }}
          respect-editorconfig: ${{ inputs.respect-editorconfig }}
          config-include: ${{ inputs.config-include }}
          config-exclude: ${{ inputs.config-exclude }}
          configuration: ${{ inputs.configuration }}
          framework: ${{ inputs.framework }}
          project-mode: ${{ inputs.project-mode }}
          restore: ${{ inputs.restore }}
          dotnet-version: ${{ inputs.dotnet-version }}
          upload-sarif: ${{ inputs.upload-sarif }}
          category: ${{ inputs.category }}
          upload-artifact: ${{ inputs.upload-artifact }}
          artifact-name: ${{ inputs.artifact-name }}
          artifact-retention-days: ${{ inputs.artifact-retention-days }}
